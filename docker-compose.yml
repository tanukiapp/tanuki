version: "3.9"

services:
  catalog:
    build: ./services/catalog
    ports:
      - "3001:3000"
    volumes:
      - ./services/catalog:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  schedule:
    build: ./services/schedule
    ports:
      - "3002:3000"
    volumes:
      - ./services/schedule:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  gateway:
    build: ./services/gateway
    ports:
      - "3000:3000"
    volumes:
      - ./services/gateway:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
